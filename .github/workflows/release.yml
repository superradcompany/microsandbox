name: Release

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Release run whose remaining Rust crates should be published
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: recover-crates
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/toks/fix-crate-publish-order'
    runs-on: ubuntu-latest
    steps:
      - name: Verify original release passed validation
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > run.json
          jq -e '.path == ".github/workflows/release.yml" and .event == "push" and .status == "completed"' run.json
          tag=$(jq -r '.head_branch' run.json)
          sha=$(jq -r '.head_sha' run.json)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' | grep -qx false
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/jobs?per_page=100" \
            | jq -e '[.[].jobs[] | select(.name == "Validate complete release" and .conclusion == "success")] | length == 1'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Use the repaired publisher, but retain the exact released source tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: publisher

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}
          path: release

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Publish remaining crates
        working-directory: release
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 ../publisher/scripts/ci/publish-crates.py
