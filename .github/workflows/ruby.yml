name: Ruby SDK

on:
  push:
    branches: [main]
    paths:
      - "sdk/ruby/**"
      - ".github/workflows/ruby.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdk/ruby/**"
      - ".github/workflows/ruby.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"

jobs:
  build:
    name: Ruby ${{ matrix.ruby }} / Linux x86_64
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: sdk/ruby/ext/microsandbox
          cache-bin: false

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev

      - name: Install Ruby build dependencies
        run: gem install rake rake-compiler test-unit rb_sys --no-document

      - name: Check Rust extension
        working-directory: sdk/ruby/ext/microsandbox
        run: |
          cargo fmt -- --check
          cargo check
          cargo clippy -- -D warnings

      - name: Compile and test source tree
        working-directory: sdk/ruby
        run: rake clean compile test

      - name: Build and install source gem
        working-directory: sdk/ruby
        run: |
          gem build microsandbox.gemspec
          gem install --local microsandbox-*.gem --no-document
          ruby --disable-gems -e 'require "rubygems"; require "microsandbox"; abort unless Microsandbox.version == "0.6.8"'
