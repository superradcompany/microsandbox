name: Advisory Audit

# Audits locked Rust dependencies against the RustSec Advisory Database across
# all shipped targets (Linux GNU/musl, macOS, Windows MSVC/MinGW). Runs weekly,
# on manual dispatch, and whenever Rust manifests or lockfiles change so
# upstream advisories do not break unrelated PRs.

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - sdk/ruby/ext/microsandbox/Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - sdk/ruby/ext/microsandbox/Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cargo-deny:
    name: Rust security advisories (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-deny@0.22.0

      - name: Audit workspace lockfile
        run: cargo deny --locked check advisories

      - name: Audit Ruby extension standalone lockfile
        run: |
          set -euo pipefail
          pin="$(sed -nE 's/.*package = "microsandbox", version = "=([^"]+)".*/\1/p' sdk/ruby/ext/microsandbox/Cargo.toml)"
          if [ -z "$pin" ]; then
            echo "::error::could not read the exact microsandbox pin from sdk/ruby/ext/microsandbox/Cargo.toml"
            exit 1
          fi
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'User-Agent: microsandbox-ci (https://github.com/superradcompany/microsandbox)' \
            "https://crates.io/api/v1/crates/microsandbox/$pin")"
          case "$status" in
            200)
              cargo deny --locked --config deny.toml \
                --manifest-path sdk/ruby/ext/microsandbox/Cargo.toml \
                check advisories -A advisory-not-detected
              ;;
            404)
              echo "::notice::microsandbox $pin is not on crates.io yet; skipping standalone Ruby lockfile audit"
              ;;
            *)
              echo "::error::crates.io returned HTTP $status for microsandbox $pin"
              exit 1
              ;;
          esac
