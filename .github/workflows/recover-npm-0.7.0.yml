name: Recover npm 0.7.0

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Match the original tag release so its reruns cannot publish concurrently.
  group: Release-refs/tags/v0.7.0
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    # Five indexing waits can take 75 minutes, plus downloads/builds/publication.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preserve recovery helpers
        run: cp scripts/ci/{publish-npm-package,wait-for-npm-packages}.mjs "$RUNNER_TEMP/"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a427b4365765cb633df3267e0cf3d118c25f1843

      - name: Check out release MCP source
        run: git submodule update --init mcp

      - name: Apply recovery helpers
        run: cp "$RUNNER_TEMP/"{publish-npm-package,wait-for-npm-packages}.mjs scripts/ci/

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download Node SDK artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: node-artifacts
          pattern: node-sdk-*
          run-id: 35048560893
          github-token: ${{ github.token }}

      - name: Place binaries and update generated files
        run: |
          # Copy prepared platform package payloads.
          for dir in darwin-arm64 linux-x64-gnu linux-arm64-gnu win32-x64-msvc win32-arm64-msvc; do
            mkdir -p "sdk/node-ts/npm/$dir/bin" "sdk/node-ts/npm/$dir/lib"
            cp "node-artifacts/node-sdk-$dir/npm/$dir"/microsandbox.*.node "sdk/node-ts/npm/$dir/"
            cp "node-artifacts/node-sdk-$dir/npm/$dir/bin/"* "sdk/node-ts/npm/$dir/bin/"
            cp "node-artifacts/node-sdk-$dir/npm/$dir/lib/"* "sdk/node-ts/npm/$dir/lib/"
            # GitHub Actions artifacts strip Unix exec bits; restore before publish
            # so the published tarball carries 0755 on the binary.
            if [ -f "sdk/node-ts/npm/$dir/bin/msb" ]; then
              chmod +x "sdk/node-ts/npm/$dir/bin/msb"
            fi
          done

          # Copy napi-generated bindings into the root package's native/ dir
          # (use darwin-arm64; all platforms emit identical JS and types).
          # Keep the declaration path aligned with package.json exports/files.
          cp node-artifacts/node-sdk-darwin-arm64/native/index.cjs sdk/node-ts/native/index.cjs
          cp node-artifacts/node-sdk-darwin-arm64/native/index.d.ts sdk/node-ts/native/index.d.ts

      - name: Build shared TypeScript packages in dependency order
        working-directory: packages
        run: |
          npm ci
          npm run build

      - name: Build TypeScript output (root package dist/)
        working-directory: sdk/node-ts
        run: |
          npm ci --omit=optional
          npm run build:ts

      - name: Publish shared types and protocol engine
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: packages
        run: |
          node ../scripts/ci/publish-npm-package.mjs microsandbox-types/typescript
          node ../scripts/ci/publish-npm-package.mjs protocol-client/typescript

      - name: Wait for shared dependencies to be indexed
        run: |
          VERSION="0.7.0"
          node scripts/ci/wait-for-npm-packages.mjs "$VERSION" \
            @microsandbox/types @microsandbox/protocol-client

      - name: Publish agent and control clients
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: packages
        run: |
          node ../scripts/ci/publish-npm-package.mjs agent-client/typescript
          node ../scripts/ci/publish-npm-package.mjs control-client/typescript

      - name: Wait for shared clients to be indexed
        run: |
          VERSION="0.7.0"
          node scripts/ci/wait-for-npm-packages.mjs "$VERSION" \
            @microsandbox/agent-client @microsandbox/control-client

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in darwin-arm64 linux-x64-gnu linux-arm64-gnu win32-x64-msvc win32-arm64-msvc; do
            echo "Publishing @superradcompany/microsandbox-$dir..."
            cd sdk/node-ts/npm/$dir
            node ../../../../scripts/ci/publish-npm-package.mjs .
            cd ../../../..
          done

      - name: Wait for npm to index platform packages
        run: |
          VERSION="0.7.0"
          node scripts/ci/wait-for-npm-packages.mjs "$VERSION" \
            @superradcompany/microsandbox-darwin-arm64 \
            @superradcompany/microsandbox-linux-arm64-gnu \
            @superradcompany/microsandbox-linux-x64-gnu \
            @superradcompany/microsandbox-win32-arm64-msvc \
            @superradcompany/microsandbox-win32-x64-msvc

      - name: Verify root package platform dependencies
        working-directory: sdk/node-ts
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const optionalDependencies = pkg.optionalDependencies ?? {};
          const required = [
            "@superradcompany/microsandbox-darwin-arm64",
            "@superradcompany/microsandbox-linux-arm64-gnu",
            "@superradcompany/microsandbox-linux-x64-gnu",
            "@superradcompany/microsandbox-win32-arm64-msvc",
            "@superradcompany/microsandbox-win32-x64-msvc",
          ];

          const missing = required.filter((name) => optionalDependencies[name] !== pkg.version);

          if (missing.length > 0) {
            console.error(`Missing or mismatched platform optional dependencies: ${missing.join(", ")}`);
            process.exit(1);
          }
          NODE

      - name: Publish root package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: sdk/node-ts
        run: node ../../scripts/ci/publish-npm-package.mjs .

      - name: Wait for root package to be indexed
        run: node scripts/ci/wait-for-npm-packages.mjs 0.7.0 microsandbox

      - name: Build MCP server
        working-directory: mcp
        run: |
          # The pinned MCP source has no lockfile. Disable dependency lifecycle
          # scripts during resolution and keep publishing credentials out of build.
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi
          npm run build

      - name: Publish MCP server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: mcp
        run: node ../scripts/ci/publish-npm-package.mjs .

      - name: Verify MCP publication
        run: node scripts/ci/wait-for-npm-packages.mjs 0.7.0 "$(node -p "require('./mcp/package.json').name")"
