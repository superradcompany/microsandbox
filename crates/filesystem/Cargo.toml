[package]
name = "microsandbox-filesystem"
description = "Filesystem backends and guest filesystem support for microsandbox."
version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true

[lib]
path = "lib/lib.rs"

[dependencies]
hex.workspace = true
libc.workspace = true
microsandbox-utils.workspace = true
msb_krun.workspace = true
sha2.workspace = true
scopeguard.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
default = ["download-binaries", "embed-binaries"]
download-binaries = ["embed-binaries", "microsandbox-utils/http-client"]
embed-binaries = []

[build-dependencies]
microsandbox-utils.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_SystemServices"] }
