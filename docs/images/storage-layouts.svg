<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title description">
  <title id="title">Layered and flat root storage</title>
  <desc id="description">Layered roots combine shared OCI layers with a writable layer for each sandbox. Flat roots clone a materialized ext4 image into a private disk for each sandbox.</desc>

  <defs>
    <marker id="arrowhead" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1.25L7 4 1 6.75" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <style>
    :root {
      --text: #e5e7eb;
      --muted: #9ca3af;
      --line: #6b7280;
      --accent: #bf84fe;
    }

    text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .text { fill: var(--text); }
    .muted { fill: var(--muted); }
    .panel { fill: none; stroke: var(--line); stroke-width: 1.2; }
    .shared { fill: var(--muted); fill-opacity: 0.08; stroke: var(--muted); stroke-width: 1.2; }
    .private { fill: var(--accent); fill-opacity: 0.1; stroke: var(--accent); stroke-width: 1.2; }
    .arrow { fill: none; stroke: var(--line); stroke-width: 1.3; marker-end: url(#arrowhead); }

    @media (prefers-color-scheme: light) {
      :root {
        --text: #1f2937;
        --muted: #6b7280;
        --line: #9ca3af;
        --accent: #8b5bb8;
      }
    }
  </style>

  <rect class="panel" x="15" y="15" width="420" height="330" rx="16" />
  <text class="text" x="225" y="52" text-anchor="middle" font-size="19" font-weight="650">Layered (default)</text>
  <text class="muted" x="225" y="76" text-anchor="middle" font-size="13">shared image · private writes</text>

  <rect class="shared" x="115" y="100" width="220" height="52" rx="9" />
  <text class="text" x="225" y="132" text-anchor="middle" font-size="15">Shared OCI layers</text>

  <rect class="private" x="52" y="183" width="146" height="44" rx="8" />
  <text class="text" x="125" y="210" text-anchor="middle" font-size="14">Writable layer</text>
  <rect class="private" x="252" y="183" width="146" height="44" rx="8" />
  <text class="text" x="325" y="210" text-anchor="middle" font-size="14">Writable layer</text>

  <rect class="panel" x="52" y="261" width="146" height="48" rx="8" />
  <text class="text" x="125" y="290" text-anchor="middle" font-size="14">Sandbox A</text>
  <rect class="panel" x="252" y="261" width="146" height="48" rx="8" />
  <text class="text" x="325" y="290" text-anchor="middle" font-size="14">Sandbox B</text>

  <path class="arrow" d="M175 152 C160 185 145 220 132 260" />
  <path class="arrow" d="M275 152 C290 185 305 220 318 260" />
  <path class="arrow" d="M125 227 L125 260" />
  <path class="arrow" d="M325 227 L325 260" />

  <rect class="panel" x="465" y="15" width="420" height="330" rx="16" />
  <text class="text" x="675" y="52" text-anchor="middle" font-size="19" font-weight="650">Flat</text>
  <text class="muted" x="675" y="76" text-anchor="middle" font-size="13">private root disk per sandbox</text>

  <rect class="shared" x="565" y="100" width="220" height="52" rx="9" />
  <text class="text" x="675" y="124" text-anchor="middle" font-size="15">Materialized image</text>
  <text class="muted" x="675" y="142" text-anchor="middle" font-size="12">ext4</text>

  <rect class="private" x="502" y="235" width="146" height="74" rx="9" />
  <text class="text" x="575" y="266" text-anchor="middle" font-size="14">Sandbox A</text>
  <text class="muted" x="575" y="287" text-anchor="middle" font-size="12">private clone</text>
  <rect class="private" x="702" y="235" width="146" height="74" rx="9" />
  <text class="text" x="775" y="266" text-anchor="middle" font-size="14">Sandbox B</text>
  <text class="muted" x="775" y="287" text-anchor="middle" font-size="12">private clone</text>

  <path class="arrow" d="M625 152 C610 182 592 205 580 234" />
  <path class="arrow" d="M725 152 C740 182 758 205 770 234" />
</svg>
