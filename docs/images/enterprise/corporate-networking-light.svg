<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 374" width="720" role="img" aria-labelledby="title description" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Guest traffic, DNS, and image downloads take separate host paths</title>
  <desc id="description">The guest microVM is isolated within the employee device. Guest connections cross into the host runtime for network policy, then use host routing directly or through an optional local SOCKS proxy. Sandbox DNS and CLI or SDK image downloads use separate paths. Host VPN or traffic steering can apply to each path according to its policy.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" /></marker></defs>
  <rect x="12" y="12" width="496" height="330" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="5 4" />
  <text x="30" y="36" text-anchor="start" font-size="12" font-weight="600" fill="#606875">EMPLOYEE DEVICE</text>
  <rect x="532" y="54" width="176" height="288" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="5 4" />
  <text x="620" y="36" text-anchor="middle" font-size="12" font-weight="600" fill="#606875">BEYOND THE DEVICE</text>
  <rect x="28" y="54" width="126" height="212" rx="10" fill="#fff5eb" stroke="#b45309" stroke-width="1.2" stroke-dasharray="5 4" />
  <text x="91" y="77" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">Guest microVM</text>
  <rect x="40" y="100" width="102" height="46" rx="10" fill="#fff5eb" stroke="#b45309" stroke-width="1.2" />
  <text x="91" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Workload</text>
  <rect x="180" y="100" width="137" height="46" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2" />
  <text x="248" y="119" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Host runtime</text>
  <text x="248" y="136" text-anchor="middle" font-size="11" font-weight="400" fill="#606875">Network policy</text>
  <rect x="365" y="100" width="125" height="46" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2" />
  <text x="427" y="119" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Host routing</text>
  <text x="427" y="136" text-anchor="middle" font-size="11" font-weight="400" fill="#606875">VPN / steering</text>
  <rect x="350" y="164" width="140" height="39" rx="10" fill="#f3eaff" stroke="#7c3aed" stroke-width="1.2" />
  <text x="420" y="181" text-anchor="middle" font-size="13" font-weight="600" fill="#7c3aed">Local SOCKS proxy</text>
  <text x="420" y="195" text-anchor="middle" font-size="10" font-weight="400" fill="#606875">Optional</text>
  <rect x="546" y="100" width="148" height="46" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2" />
  <text x="620" y="119" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Private services</text>
  <text x="620" y="136" text-anchor="middle" font-size="12" font-weight="400" fill="#606875">Internet</text>
  <rect x="40" y="214" width="102" height="45" rx="10" fill="#fff5eb" stroke="#b45309" stroke-width="1.2" />
  <text x="91" y="241" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">DNS query</text>
  <rect x="180" y="214" width="310" height="45" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2" />
  <text x="335" y="233" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Sandbox DNS forwarder</text>
  <text x="335" y="250" text-anchor="middle" font-size="11" font-weight="400" fill="#606875">DNS policy + upstream resolver</text>
  <rect x="546" y="214" width="148" height="45" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2" />
  <text x="620" y="241" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">DNS resolver</text>
  <rect x="180" y="282" width="310" height="45" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2" />
  <text x="335" y="310" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">CLI / SDK image download</text>
  <rect x="546" y="282" width="148" height="45" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2" />
  <text x="620" y="310" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Image registry</text>
  <path d="M 142 123 H 179" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path d="M 317 123 H 364" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path d="M 248 146 V 184 H 349" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path d="M 420 164 V 147" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path d="M 490 123 H 545" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path d="M 142 237 H 179" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path d="M 490 237 H 545" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path d="M 490 305 H 545" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" />
  <text x="360" y="365" text-anchor="middle" font-size="12" font-weight="400" fill="#606875">Host VPN / traffic steering can apply to each path, according to its policy.</text>
</svg>
