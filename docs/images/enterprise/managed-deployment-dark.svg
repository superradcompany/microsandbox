<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" role="img" aria-labelledby="title description" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="title">Managed settings have the highest precedence</title>
<desc id="description">Configuration layers are applied from built-in defaults through user configuration and CLI or SDK options to managed overrides. Later layers override supplied fields; omitted fields keep earlier values.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#71717a"/></marker></defs>
<text x="400" y="30" text-anchor="middle" font-size="15" font-weight="400" fill="#a1a1aa">Increasing precedence</text>
<rect x="16" y="56" width="171" height="66" rx="9" fill="#24212b" stroke="#71717a"/>
<text x="101.5" y="83" text-anchor="middle" font-size="16" font-weight="600" fill="#e5e7eb">Built-in defaults</text>
<text x="101.5" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#a1a1aa">Starting values</text>
<path d="M190 89 L210 89" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="215" y="56" width="171" height="66" rx="9" fill="#24212b" stroke="#71717a"/>
<text x="300.5" y="83" text-anchor="middle" font-size="16" font-weight="600" fill="#e5e7eb">User configuration</text>
<text x="300.5" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#a1a1aa">Employee choices</text>
<path d="M389 89 L409 89" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="414" y="56" width="171" height="66" rx="9" fill="#24212b" stroke="#71717a"/>
<text x="499.5" y="83" text-anchor="middle" font-size="16" font-weight="600" fill="#e5e7eb">CLI / SDK options</text>
<text x="499.5" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#a1a1aa">Per-call choices</text>
<path d="M588 89 L608 89" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="613" y="56" width="171" height="66" rx="9" fill="#2b203c" stroke="#c49aff"/>
<text x="698.5" y="83" text-anchor="middle" font-size="16" font-weight="600" fill="#c49aff">Managed overrides</text>
<text x="698.5" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#a1a1aa">Administrator policy</text>
<text x="400" y="158" text-anchor="middle" font-size="15" font-weight="400" fill="#a1a1aa">Later layers override supplied fields. Omitted fields keep earlier values.</text>
</svg>
