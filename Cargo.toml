[workspace]
resolver = "3"
exclude = ["sdk/rust/fuzz"]
members = [
    "crates/agentd",
    "crates/cli",
    "crates/db",
    "crates/filesystem",
    "crates/image",
    "crates/metrics",
    "crates/metrics-collector",
    "packages/agent-client/rust",
    "packages/microsandbox-types/rust",
    "sdk/rust",
    "crates/migration",
    "crates/protocol",
    "crates/runtime",
    "crates/testing/init",
    "crates/testing/macros",
    "crates/testing/utils",
    "crates/utils",
    "crates/vsock",
    "examples/rust/cloud-backend",
    "examples/rust/fs-read-stream",
    "examples/rust/init-handoff",
    "examples/rust/logs-read",
    "examples/rust/metrics-stream",
    "examples/rust/net-basic",
    "examples/rust/net-dns",
    "examples/rust/net-policy",
    "examples/rust/net-ports",
    "examples/rust/net-secrets",
    "examples/rust/net-secrets-body",
    "examples/rust/net-tls",
    "examples/rust/root-bind",
    "examples/rust/root-block",
    "examples/rust/root-oci",
    "examples/rust/rootfs-patch",
    "examples/rust/shell-attach",
    "examples/rust/snapshot-fork",
    "examples/rust/volume-disk",
    "examples/rust/volume-named",
    "sdk/node-ts",
    "sdk/python",
    "sdk/go/native",
]

[workspace.package]
authors = ["Super Rad Company <development@superrad.company>"]
repository = "https://github.com/superradcompany/microsandbox"
version = "0.6.15"
license = "Apache-2.0"
edition = "2024"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

# CI artifacts exercise optimized code without paying the full release/LTO
# cost. The release workflow remains the only place that uses `release`.
[profile.ci]
inherits = "release"
opt-level = 1
codegen-units = 16
lto = false
strip = false

[workspace.dependencies]
# Internal crates. Versioned here so a release bumps one place, not every
# manifest; members reference them via `{ workspace = true }`.
# `default-features = false` on crates whose consumers opt into features
# explicitly (see each member manifest); other consumers re-enable defaults.
# Exact (`=`) pins: these crates share private, unstable APIs across patch
# releases, so every published version must resolve its siblings to the same
# version. Caret would let an older release pull newer siblings and break.
microsandbox = { version = "=0.6.15", path = "sdk/rust", default-features = false }
microsandbox-agent-client = { version = "=0.6.15", path = "packages/agent-client/rust" }
microsandbox-db = { version = "=0.6.15", path = "crates/db" }
microsandbox-filesystem = { version = "=0.6.15", path = "crates/filesystem", default-features = false }
microsandbox-image = { version = "=0.6.15", path = "crates/image" }
microsandbox-metrics = { version = "=0.6.15", path = "crates/metrics" }
microsandbox-types = { version = "=0.6.15", path = "packages/microsandbox-types/rust" }
microsandbox-migration = { version = "=0.6.15", path = "crates/migration" }
microsandbox-network = { version = "=0.6.15", path = "crates/network" }
microsandbox-protocol = { version = "=0.6.15", path = "crates/protocol" }
microsandbox-runtime = { version = "=0.6.15", path = "crates/runtime", default-features = false }
microsandbox-utils = { version = "=0.6.15", path = "crates/utils" }
microsandbox-vsock = { version = "=0.6.15", path = "crates/vsock" }
msb_krun = "=0.1.32"
msb_krun_utils = "=0.1.32"
test-macros = { path = "crates/testing/macros" }
test-utils = { path = "crates/testing/utils" }

# External crates.
anyhow = "1.0"
astral-tokio-tar = "0.6"
base64 = "0.23"
async-compression = "0.4"
blake3 = "1.8"
bytes = "1.9"
cap-primitives = "4.0.2"
cap-std = "4.0.2"
chrono = { version = "0.4", features = ["serde"] }
ciborium = "0.2"
clap = { version = "4.6", features = ["color", "derive"] }
clap_complete = "4.6"
console = "0.16"
crossbeam-queue = "0.3"
crossterm = { version = "0.29.0", features = ["events"] }
dirs = "6.0"
etherparse = "0.19"
flate2 = { version = "1.0", features = ["zlib-rs"] }
futures = "0.3"
futures-util = "0.3"
hex = "0.4"
hickory-net = "0.26.1"
hickory-proto = "0.26.1"
httlib-hpack = "0.1.3"
indicatif = "0.18"
ipnetwork = { version = "0.21.0", features = ["serde"] }
libc = "0.2"
nix = "0.31"
notify = "8"
oci-client = "0.17"
oci-spec = "0.10.0"
rand = "0.10.1"
rayon = "1.11"
reflink-copy = "0.1"
reqwest = { version = "0.13", features = ["json", "stream"] }
resolv-conf = "0.7"
scopeguard = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
serde-saphyr = { version = "1.0.1", default-features = false, features = ["deserialize"] }
sha2 = "0.11.0"
smoltcp = { version = "0.13", default-features = false }
socket2 = "0.6"
strum = { version = "0.28", features = ["derive"] }
tar = "0.4"
time = "0.3"
tempfile = "3.15"
thiserror = "2.0"
# Keep Tokio's full capability set without its optional parking_lot backend.
# A Ruby process may fork after the native runtime has started; inherited
# parking_lot waiter state can reference worker threads that do not survive in
# the child, causing the rebuilt runtime to segfault.
tokio = { version = "1.52", features = [
    "fs",
    "io-util",
    "io-std",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "12.0.1"
typed-builder = "0.23"
typed-path = "0.12"
which = "8"
xattr = "1.3"
zeroize = { version = "1.8", features = ["derive", "serde"] }
sea-orm = { version = "2.0.0", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlite-use-returning-for-3_35",
    "sqlx-sqlite",
    "with-chrono",
] }
sea-orm-migration = { version = "2.0.0", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "sqlite",
] }
ureq = { version = "3", features = ["platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = [
    "logging",
    "ring",
    "std",
    "tls12",
] }
tokio-rustls = "0.26"
# 1.9 is the first release with the `pem` module (PemObject::pem_slice_iter).
rustls-pki-types = "1.9"
rustls-native-certs = "0.8"
rustls-platform-verifier = "0.7"
rcgen = { version = "0.14", features = ["x509-parser"] }
lru = "0.18.0"
parking_lot = "0.12"
rpassword = "7"
russh = "0.62.4"
russh-sftp = "2.3.0"
