[package]
name = "microsandbox-node"
version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]
path = "native/lib.rs"

[features]
# Full remains the default distribution. Lean builds select exactly one provider
# and deliberately exclude both runtime download and embedded binary features.
default = ["full"]
full = ["local", "remote", "microsandbox/download-binaries", "microsandbox/keyring"]
local = ["microsandbox/local", "microsandbox/net"]
remote = ["microsandbox/cloud", "microsandbox/net"]

[dependencies]
microsandbox = { workspace = true, default-features = false, features = ["ssh"] }
microsandbox-network = { workspace = true, default-features = false }
ipnetwork = { workspace = true }
napi = { version = "3", default-features = false, features = [
    "async",
    "tokio_rt",
    "napi9",
] }
napi-derive = "3"
tokio = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
# Rust test executables have no Node host to provide the N-API symbols.
napi = { version = "3", default-features = false, features = ["dyn-symbols"] }
