[package]
name = "microsandbox-go"
description = "C-ABI FFI layer exposing microsandbox to the Go SDK via CGO."
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
name = "microsandbox_go_ffi"
crate-type = ["staticlib", "cdylib"]

[dependencies]
microsandbox = { workspace = true, default-features = true, features = ["net", "ssh"] }
microsandbox-types.workspace = true
microsandbox-network.workspace = true
ipnetwork.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-stream = "0.1"
serde = { workspace = true }
serde_json.workspace = true
libc.workspace = true
base64.workspace = true
cap-std.workspace = true
chrono.workspace = true

[dev-dependencies]
microsandbox-types = { workspace = true, features = ["test-support"] }

[build-dependencies]
cbindgen = "0.29"
