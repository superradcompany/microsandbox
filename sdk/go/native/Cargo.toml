[package]
name = "microsandbox-go"
description = "C-ABI FFI layer exposing microsandbox to the Go SDK via CGO."
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
name = "microsandbox_go_ffi"
crate-type = ["staticlib", "cdylib"]

[features]
# Full remains the default distribution. Lean builds select exactly one provider
# and deliberately exclude both runtime download and embedded binary features.
default = ["full"]
full = ["local", "remote", "microsandbox/download-binaries", "microsandbox/keyring"]
local = ["microsandbox/local", "microsandbox/net"]
remote = ["microsandbox/cloud", "microsandbox/net"]

[dependencies]
microsandbox = { workspace = true, default-features = false, features = ["ssh"] }
microsandbox-network = { workspace = true, default-features = false }
ipnetwork.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-stream = "0.1"
serde = { workspace = true }
serde_json.workspace = true
libc.workspace = true
base64.workspace = true
cap-std.workspace = true
chrono.workspace = true

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
tempfile.workspace = true
